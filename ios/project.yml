name: LiteTrans
options:
  bundleIdPrefix: io.github.flydmonkey
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en
settings:
  base:
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
targets:
  LiteTrans:
    type: application
    platform: iOS
    sources:
      - LiteTrans
    resources:
      - LiteTrans/Resources/Assets.xcassets
      - LiteTrans/Resources/Localizable.xcstrings
    info:
      path: LiteTrans/Resources/Info.plist
      properties:
        CFBundleDisplayName: LiteTrans
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "5"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSPhotoLibraryAddUsageDescription: LiteTrans saves converted videos to Photos when you choose Photos as the output.
        NSCameraUsageDescription: LiteTrans does not take photos or record new video. Conversion libraries on this device may reference camera APIs while processing files you pick.
        NSMicrophoneUsageDescription: LiteTrans does not record new audio with the microphone. Conversion libraries on this device may reference microphone APIs while processing files you pick.
        NSLocalNetworkUsageDescription: LiteTrans serves finished files on your Wi‑Fi so you can open them in a computer browser.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        BGTaskSchedulerPermittedIdentifiers:
          - io.github.flydmonkey.litetrans.process
        UIBackgroundModes:
          - processing
        CFBundleURLTypes:
          - CFBundleURLName: io.github.flydmonkey.litetrans
            CFBundleURLSchemes:
              - litetrans
        CFBundleLocalizations:
          - en
          - zh-Hans
          - zh-Hant
          - ja
          - ko
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.flydmonkey.litetrans
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: LiteTransActivityKit
        embed: true
        codeSign: true
      - target: LiteTransLiveActivity
        embed: true
        codeSign: true
      - framework: Vendor/FFmpeg/ffmpegkit.xcframework
        embed: true
        codeSign: true
      - framework: Vendor/FFmpeg/libavcodec.xcframework
        embed: true
        codeSign: true
      - framework: Vendor/FFmpeg/libavformat.xcframework
        embed: true
        codeSign: true
      - framework: Vendor/FFmpeg/libavutil.xcframework
        embed: true
        codeSign: true
      - framework: Vendor/FFmpeg/libavfilter.xcframework
        embed: true
        codeSign: true
      - framework: Vendor/FFmpeg/libavdevice.xcframework
        embed: true
        codeSign: true
      - framework: Vendor/FFmpeg/libswscale.xcframework
        embed: true
        codeSign: true
      - framework: Vendor/FFmpeg/libswresample.xcframework
        embed: true
        codeSign: true
    scheme:
      testTargets:
        - LiteTransTests
  LiteTransActivityKit:
    type: framework
    platform: iOS
    sources:
      - LiteTransActivityKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.flydmonkey.litetrans.activitykit
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "5"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  LiteTransLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - LiteTransLiveActivity
    resources:
      - LiteTrans/Resources/Localizable.xcstrings
    info:
      path: LiteTransLiveActivity/Info.plist
      properties:
        CFBundleDisplayName: LiteTrans
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "5"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.flydmonkey.litetrans.LiveActivity
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    dependencies:
      - target: LiteTransActivityKit
    scheme:
      gatherCoverageData: false
  LiteTransTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LiteTransTests
        excludes:
          - "Domain/**"
    dependencies:
      - target: LiteTrans
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
