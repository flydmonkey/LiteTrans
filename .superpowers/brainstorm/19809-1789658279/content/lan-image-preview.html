<h2>图片 Tab：点开一张图之后呢？</h2>

<div class="cards">

            <span style="padding:6px 10px;border-bottom:2px solid #c45a2a;color:#c45a2a;font-weight:600">图片</span>

  </div>

  <div class="card" data-choice="b" onclick="toggleSelect(this)">
